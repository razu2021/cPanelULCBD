name: Auto Deploy on SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ১. PHP এবং Composer Dependencies ইনস্টল
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, curl, openssl, xml, zip

      - name: Install Composer Dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      # ২. Node.js সেটআপ এবং Vite Build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Build
        run: |
          npm install
          npm run build 

      # ৩. ফাইলগুলো হোস্টিং সার্ভারে পাঠানো (SCP)
      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "domains/globalguideguru.com/public_html/reversit"
          rm: false

      # ৪. হোস্টিং সার্ভারে গিয়ে লারাভেল কমান্ড রান করা
      - name: Post-deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd domains/globalguideguru.com/public_html/reversit
            # প্রোডাকশন মোডে ভেন্ডর ফাইল আপডেট
            composer install --no-dev --optimize-autoloader
            # ডাটাবেস মাইগ্রেশন (ফোর্স মোড প্রোডাকশনের জন্য নিরাপদ)
            php artisan migrate --force
            # অপ্টিমাইজেশন (ক্লিন ভিউ এবং কনফিগ ক্যাশ)
            php artisan optimize
            # স্টোরেজ লিংক তৈরি